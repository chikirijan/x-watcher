name: X to Discord

# Runs on the hour and half hour. Each run boots RSSHub once, then polls it
# every 60 seconds until 2 minutes before the NEXT boundary, then exits.
#
# Ending on a wall-clock boundary rather than after a fixed duration means a
# manually triggered run still finishes in time for the next scheduled one,
# so a manual run can no longer knock the schedule out of sync.
#
# Gap between runs: about 2 minutes of clock, plus ~40s container boot.
on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xwatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start RSSHub
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
        run: |
          docker run -d --name rsshub \
            -p 1200:1200 \
            -e TWITTER_AUTH_TOKEN="$TWITTER_AUTH_TOKEN" \
            -e CACHE_EXPIRE=30 \
            -e CACHE_CONTENT_EXPIRE=30 \
            -e NODE_ENV=production \
            diygod/rsshub

      - name: Wait for RSSHub
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:1200/ > /dev/null 2>&1; then
              echo "RSSHub up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "RSSHub failed to start"; docker logs rsshub; exit 1

      - name: Poll every 60s for 55 minutes
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # embed | plain | compact
          POST_STYLE: embed
        run: |
          NOW=$(date +%s)
          # next :00 or :30 wall-clock boundary, minus a 2 minute buffer
          END=$(( ( NOW / 1800 + 1 ) * 1800 - 120 ))
          # if we started right on top of a boundary, run to the following one
          if [ $(( END - NOW )) -lt 300 ]; then END=$(( END + 1800 )); fi
          echo "polling until $(date -u -d @${END} '+%H:%M:%S') UTC  ($(( (END-NOW)/60 )) min)"
          N=0
          while [ "$(date +%s)" -lt "$END" ]; do
            N=$((N+1))
            echo "--- poll $N ---"
            python watch.py || echo "poll failed, continuing"
            sleep 60
          done
          echo "finished after $N polls"

      - name: RSSHub logs on failure
        if: failure()
        run: docker logs rsshub || true

      # seen.json is the only file we write. If a previous run pushed a
      # different version, ours is newer, so take ours and force it. This
      # avoids the rebase conflict that leaves the runner on a detached HEAD.
      - name: Save state
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git checkout main || git checkout -B main
          git checkout --ours seen.json 2>/dev/null || true
          git add seen.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "state"
          for i in 1 2 3; do
            git push origin main && exit 0
            echo "push $i failed, rebasing onto latest"
            git fetch origin main
            git rebase --strategy-option=ours origin/main || git rebase --abort
            sleep 3
          done
          echo "could not push state after 3 tries"
