name: X to Discord

# Runs hourly. Each run starts RSSHub once, then polls it every 60 seconds
# for ~55 minutes before exiting. This gives 1-minute alerts using a single
# job, so there is no state-file conflict and RSSHub only boots once.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xwatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start RSSHub
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
        run: |
          docker run -d --name rsshub \
            -p 1200:1200 \
            -e TWITTER_AUTH_TOKEN="$TWITTER_AUTH_TOKEN" \
            -e CACHE_EXPIRE=30 \
            -e CACHE_CONTENT_EXPIRE=30 \
            -e NODE_ENV=production \
            diygod/rsshub

      - name: Wait for RSSHub
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:1200/ > /dev/null 2>&1; then
              echo "RSSHub up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "RSSHub failed to start"; docker logs rsshub; exit 1

      - name: Poll every 60s for 55 minutes
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          END=$(( $(date +%s) + 3300 ))     # 55 minutes
          N=0
          while [ "$(date +%s)" -lt "$END" ]; do
            N=$((N+1))
            echo "--- poll $N ---"
            python watch.py || echo "poll failed, continuing"
            sleep 60
          done
          echo "finished after $N polls"

      - name: RSSHub logs on failure
        if: failure()
        run: docker logs rsshub || true

      - name: Save state
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add seen.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "state"
          git pull --rebase --autostash || true
          git push || true
