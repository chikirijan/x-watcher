name: X to Discord

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xwatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # RSSHub runs only for the life of this job, then disappears.
      # TWITTER_AUTH_TOKEN comes from an encrypted GitHub Secret.
      - name: Start RSSHub
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
        run: |
          docker run -d --name rsshub \
            -p 1200:1200 \
            -e TWITTER_AUTH_TOKEN="$TWITTER_AUTH_TOKEN" \
            -e CACHE_EXPIRE=0 \
            -e CACHE_CONTENT_EXPIRE=0 \
            -e NODE_ENV=production \
            diygod/rsshub

      - name: Wait for RSSHub to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:1200/ > /dev/null 2>&1; then
              echo "RSSHub up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "RSSHub did not start in 60s"
          docker logs rsshub
          exit 1

      - name: Check feeds and post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python watch.py

      - name: RSSHub logs on failure
        if: failure()
        run: docker logs rsshub

      - name: Save state
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add seen.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "state"
          git push || true
