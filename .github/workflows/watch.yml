name: X to Discord

# The cron fires every 10 minutes, but a run lasts ~30 minutes. That is
# deliberate.
#
# GitHub's scheduler silently drops triggers under load - that is what caused
# the 12:30 / 13:00 / 13:30 / 14:00 runs to never appear. Firing 6 times an
# hour instead of 2 means a dropped trigger no longer creates a gap.
#
# The concurrency group absorbs the extras: while a run is in progress the
# next trigger sits as "pending", and any further trigger replaces that
# pending one. So there is never more than one running plus one waiting, and
# the waiting one starts the instant the current run ends.
#
# Net effect: near-continuous coverage, self-healing after a dropped trigger.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xwatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start RSSHub
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
        run: |
          docker run -d --name rsshub \
            -p 1200:1200 \
            -e TWITTER_AUTH_TOKEN="$TWITTER_AUTH_TOKEN" \
            -e CACHE_EXPIRE=30 \
            -e CACHE_CONTENT_EXPIRE=30 \
            -e NODE_ENV=production \
            diygod/rsshub

      - name: Wait for RSSHub
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:1200/ > /dev/null 2>&1; then
              echo "RSSHub up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "RSSHub failed to start"; docker logs rsshub; exit 1

      - name: Poll every 60s until the next boundary
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # embed | plain | compact
          POST_STYLE: embed
        run: |
          NOW=$(date +%s)
          # next :00 or :30 wall-clock boundary, minus a 2 minute buffer
          END=$(( ( NOW / 1800 + 1 ) * 1800 - 120 ))
          # if we started right on top of a boundary, run to the following one
          if [ $(( END - NOW )) -lt 300 ]; then END=$(( END + 1800 )); fi
          # hard cap: never poll for more than 30 minutes, so image pull +
          # boot + state save can never push the job past its timeout
          MAXEND=$(( NOW + 1800 ))
          if [ "$END" -gt "$MAXEND" ]; then END=$MAXEND; fi
          echo "polling until $(date -u -d @${END} '+%H:%M:%S') UTC  ($(( (END-NOW)/60 )) min)"
          git config user.name  "github-actions"
          git config user.email "actions@github.com"

          N=0
          while [ "$(date +%s)" -lt "$END" ]; do
            N=$((N+1))
            echo "--- poll $N ---"
            python watch.py || echo "poll failed, continuing"

            # commit immediately after anything is posted, so a crash or a
            # cancelled run cannot cause the same items to be sent again
            if [ -f .posted ]; then
              git fetch origin main -q
              git show origin/main:seen.json > /tmp/remote.json 2>/dev/null || echo "[]" > /tmp/remote.json
              python3 merge_state.py /tmp/remote.json
              git reset --soft origin/main -q
              git add seen.json
              git diff --staged --quiet || { git commit -q -m "state"; git push -q origin HEAD:main && echo "  state pushed"; }
              rm -f .posted
            fi

            sleep 60
          done
          echo "finished after $N polls"

      - name: RSSHub logs on failure
        if: failure()
        run: docker logs rsshub || true

      # Persist state.
      #
      # Previous version used "git rebase --strategy-option=ours", which in a
      # rebase means the UPSTREAM side - so it threw away the new state and
      # kept the old one. That is why the same posts were sent repeatedly.
      #
      # This version unions our ids with whatever is on the remote, so no
      # state can ever be lost, then commits on top of the remote tip.
      - name: Save state
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"

          for attempt in 1 2 3; do
            git fetch origin main

            # merge remote ids with ours - union, newest kept, capped
            git show origin/main:seen.json > /tmp/remote.json 2>/dev/null || echo "[]" > /tmp/remote.json
            python3 merge_state.py /tmp/remote.json

            git reset --soft origin/main
            git add seen.json
            if git diff --staged --quiet; then
              echo "no state change"
              exit 0
            fi
            git commit -m "state"
            if git push origin HEAD:main; then
              echo "state saved"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            sleep 3
          done
          echo "WARNING: could not save state - next run may repost"
